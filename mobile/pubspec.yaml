name: ai_diet_coach
description: Taiwan-focused AI food logging and coaching MVP.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  image_picker: ^1.1.2
  health: ^13.3.1
  permission_handler: ^11.3.1
  dynamic_color: ^1.8.1
  # v11 is not compatible with this project's Android Gradle Plugin 9 setup.
  file_picker: 10.3.10
  flutter_local_notifications: ^22.3.0
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1
  package_info_plus: ^9.0.1
  sensors_plus: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon_material_you.png
